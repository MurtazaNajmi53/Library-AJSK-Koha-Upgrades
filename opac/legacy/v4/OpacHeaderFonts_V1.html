<!-- Maktabat Aljamea (Sindh) — web fonts                    (v1, 20 Sep 2026)

     Tools › HTML customizations › New entry
       Display location : opacheader
       Library          : All libraries
     Paste this with "Edit with text editor", NOT the visual editor.

     WHY THIS IS NOT IN THE STYLESHEET ANY MORE
     ------------------------------------------
     Until v3 the font request lived at the top of OPACUserCSS as an
     @import. Koha puts OPACUserCSS inside an inline <style> block in the
     page head, and an @import inside inline CSS is fetched in a chain:
     the browser downloads the HTML, parses 47 KB of stylesheet, only
     then discovers that a font stylesheet is needed, requests it, waits,
     and then has to fetch the font files it names. Nothing renders until
     all of that has finished. On a slow connection that is most of a
     second on every single page of the catalogue.

     As a <link> in the HTML, the browser's preload scanner spots it
     while the page is still arriving and fetches it in parallel. The two
     preconnect lines get the DNS lookup and TLS handshake for both Google
     font hosts out of the way at the same time.

     This location renders near the top of <body>. A stylesheet link
     there is valid and is honoured by every browser; it is the earliest
     point Koha gives us without a server-side template change.

     IF YOU EVER REMOVE THIS ENTRY: nothing breaks. The catalogue falls
     back to the fonts already on the reader's machine, because
     OPACUserCSS names real fallbacks after each web font.

     NOTE: this location is not rendered on the self-checkout screen, so
     the kiosk keeps its own @import at the top of SCOUserCSS instead.
     That is deliberate — see the comment at the top of SCOUserCSS_V1.css.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&amp;family=DM+Sans:opsz,wght@9..40,400..700&amp;family=Noto+Sans:wght@400;600;700&amp;display=swap">
