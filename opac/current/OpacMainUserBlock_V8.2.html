<!-- Maktabat Aljamea (Sindh) — home page widgets          (v8.2, 13 Nov 2026)

     Tools › HTML customizations › edit the existing OpacMainUserBlock entry
       Display location : OpacMainUserBlock
       Library          : All libraries
     Paste this with "Edit with text editor", NOT the visual editor.

     OPAC release v8.2 (was OpacMainUserBlock_V4.html, from v8). Goes with
     OPACUserJS_V8.2.js and OPACUserCSS_V8.2.css. Paste over the existing
     entry rather than adding a second one, or the page shows two of
     each box.

     What changed in v8.1: a New arrivals band across the top
     (#aj-arrivals-band). OPACUserJS Part G fills it: a fan of new covers,
     how many are new to this reader, and "See new arrivals", which opens
     the popup. It stays hidden until there is something to show. The
     "New arrivals" button at the foot of the My library card is gone.

     What changed in V4 (v8): "New in the library" (#aj-new-books) is gone.
     The new books are now the New arrivals popup (OPACUserJS Part G),
     opened by itself after login and from the "New arrivals" button at
     the foot of the My library card. In its place is an empty
     statistics slot, #aj-stats. It stays hidden until something is put
     in it, so it can be filled later without touching this entry.

     Reading order, left to right on a wide screen:
       1. My library
       2. Library information  (fed by Tools › Additional tools › News)
       then statistics, full width below, once there are any.
-->
<div id="aj-home" class="aj-home">

  <section id="aj-arrivals-band" class="aj-arr-band" aria-label="New arrivals" hidden></section>

  <section id="aj-my-library" class="aj-ml" aria-live="polite" aria-label="My library">
    <p class="aj-ml__loading">Loading your account…</p>
  </section>

  <section id="aj-news" class="aj-news" aria-label="Library information">
    <div class="aj-news__head">
      <h2 class="aj-news__title">Library information</h2>
    </div>
    <p class="aj-news__empty">Loading…</p>
  </section>

  <section id="aj-stats" class="aj-stats" aria-label="Library statistics" hidden></section>

  <noscript>
    <!-- With JavaScript off, nothing can fill these boxes. Put Koha's own
         news block back and take the empty widgets away, so the page
         still tells a reader something useful. -->
    <style>
      #opac-main #news,
      #opac-main #rssnews-container { display: block; }
      #opac-main .aj-home > .aj-ml,
      #opac-main .aj-home > .aj-news { display: none; }
    </style>
    <p class="aj-ml__message">Turn on JavaScript to see your account here, or open
      <a href="/cgi-bin/koha/opac-user.pl">Your summary</a>.</p>
  </noscript>
</div>
